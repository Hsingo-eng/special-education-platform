<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>特教溝通平台 | Communication Platform</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Noto+Sans+TC:wght@400;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css?v=2">
    
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js'></script>
    <link rel="icon" type="image/png" href="logo.png">
    <style>
        /* 提問卡片基礎樣式 */
        .card.question-card {
            border: none !important;
            border-radius: 16px !important;
            background: #fff;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
            overflow: hidden;
            position: relative;
            border-left: 6px solid #e2e8f0 !important; /* 預設灰邊框 */
        }

        .card.question-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.08);
        }

        /* 左側身分識別色條 (使用 data-role) */
        .card.question-card[data-role="teacher"] { border-left-color: #4361ee !important; }   /* 藍 */
        .card.question-card[data-role="therapist"] { border-left-color: #2ec4b6 !important; } /* 綠 */
        .card.question-card[data-role="parents"] { border-left-color: #ff9f1c !important; }   /* 橘 */

        /* 內容排版 */
        .card.question-card .card-body { padding: 1.5rem 1.8rem; }
        .card.question-card h5 { font-weight: 700; color: #2c3e50; margin-bottom: 0.2rem; font-size: 1.1rem; }
        
        /* 提問對象 Tag */
        .card.question-card .badge.bg-light {
            background-color: #f1f5f9 !important;
            color: #475569 !important;
            border: 1px solid #e2e8f0;
            border-radius: 50rem;
            padding: 0.35em 0.8em;
            font-weight: 500;
        }

        /* 回覆區塊 */
        .card.question-card .bg-light.rounded {
            background-color: #f8fafc !important;
            border-left: 3px solid #cbd5e1;
            border-radius: 0 12px 12px 0 !important;
            padding: 1.2rem !important;
            margin-top: 1.5rem;
        }
        /* 🟢 修正功能選單卡片與拼圖數字的排版 (精緻版) */
        .nav-card {
            position: relative !important;
            overflow: hidden !important;
            z-index: 1;
            /* 讓卡片本身的 Hover 有平滑過渡 */
            transition: all 0.3s ease;
        }

        /* 確保卡片內的文字與圖示在最上層 */
        .nav-card .nav-title, 
        .nav-card .nav-desc, 
        .nav-card .nav-icon {
            position: relative;
            z-index: 2;
        }
        
       /* ========================================== */
        /* 🟢 拼圖與數字位置優化：往右上角推，避免碰到文字 */
        /* ========================================== */
        
        .nav-card {
            position: relative !important;
            z-index: 1;
            transition: all 0.3s ease;
            /* 👇 把背景圖(拼圖)往右上角推移 */
            background-position: right -20px top -30px !important; 
        }

        .nav-card .nav-title, .nav-card .nav-desc, .nav-card .nav-icon {
            position: relative;
            z-index: 2;
        }

        /* 讓數字跟著拼圖一起移動到右上角 */
        .nav-card .concept-number {
            position: absolute !important;
            /* 👇 數字的位置也往右上角推 */
            top: 15px !important;  
            right: 20px !important; 
            
            font-size: 2.2rem !important; 
            font-weight: 900 !important; 
            color: #cfe2ff !important; 
            z-index: 2 !important;
            pointer-events: none;
            transition: all 0.3s ease;
            line-height: 1 !important;
        }

        .nav-card:hover .concept-number {
            color: #0d6efd !important; 
            transform: scale(1.15) rotate(5deg); 
        }

        /* ========================================== */
        /* 🧩 拼圖大長方形與微動畫設計 */
        /* ========================================== */
        
        /* 定義 2列3行的緊密網格 */
        /* ========================================== */
        /* 🧩 拼圖大長方形 (防走鐘強化版) */
        /* ========================================== */
        
        .puzzle-container {
            display: grid !important;
            grid-template-columns: repeat(3, 1fr) !important;
            grid-template-rows: repeat(2, 120px) !important;
            gap: 0px !important; /* 確保沒有縫隙 */
            max-width: 700px;
            margin: 0 auto;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            background-color: #ffffff;
            overflow: visible;
            padding: 0 !important;
        }

        .puzzle-piece {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: white;
            transition: transform 0.2s ease-out, z-index 0s, box-shadow 0.2s ease-out; /* 拿掉旋轉，避免排版崩壞 */
            z-index: 1;
            margin: 0 !important;
            border: 1px solid rgba(255, 255, 255, 0.15); /* 加上極淡的內邊框，讓拼圖塊有切割感 */
            box-sizing: border-box !important;
        }

        .puzzle-icon { font-size: 2rem; margin-bottom: 8px; z-index: 5; pointer-events: none; }
        .puzzle-title { font-size: 1rem; font-weight: bold; z-index: 5; letter-spacing: 1px; pointer-events: none; }

        /* 游標移上去的動畫：單純放大並浮起來，不再旋轉！ */
        .puzzle-piece:hover {
            transform: scale(1.05) !important; 
            z-index: 10 !important;
            border-radius: 12px;
            box-shadow: 0 15px 30px rgba(0,0,0,0.25);
        }

        /* 🟢 設定每塊拼圖的顏色與外框圓角 */
        .piece-1 { background-color: #3b82f6; border-top-left-radius: 20px; z-index: 3;}
        .piece-2 { background-color: #10b981; z-index: 2;}
        .piece-3 { background-color: #8b5cf6; border-top-right-radius: 20px; z-index: 3;}
        .piece-4 { background-color: #f59e0b; border-bottom-left-radius: 20px; z-index: 4;}
        .piece-5 { background-color: #ef4444; z-index: 5;}
        .piece-6 { background-color: #06b6d4; border-bottom-right-radius: 20px; z-index: 4;}

        /* 🟢 拼圖接頭 (使用絕對定位防止擠壓網格) */
        .puzzle-piece::after {
            content: '';
            position: absolute;
            background-color: inherit;
            border-radius: 50%;
            z-index: -1;
            box-shadow: inset 0 0 0 1px rgba(255,255,255,0.15); /* 接頭邊線 */
        }

        .piece-1::after { top: 50%; right: -15px; width: 30px; height: 30px; transform: translateY(-50%); }
        .piece-2::after { bottom: -15px; left: 50%; width: 30px; height: 30px; transform: translateX(-50%); }
        .piece-3::after { top: 50%; left: -15px; width: 30px; height: 30px; transform: translateY(-50%); }
        .piece-4::after { top: -15px; left: 50%; width: 30px; height: 30px; transform: translateX(-50%); box-shadow: 60px 55px 0 0 inherit; }
        .piece-4::before { content: ''; position: absolute; top: 50%; right: -15px; width: 30px; height: 30px; background-color: inherit; border-radius: 50%; transform: translateY(-50%); z-index: -1; }
        .piece-5::after { top: 50%; right: -15px; width: 30px; height: 30px; transform: translateY(-50%); }
        .piece-6::after { top: -15px; left: 50%; width: 30px; height: 30px; transform: translateX(-50%); }

        @media (max-width: 768px) {
            .puzzle-container {
                grid-template-columns: repeat(2, 1fr) !important;
                grid-template-rows: repeat(3, 100px) !important;
            }
            .puzzle-piece::after, .puzzle-piece::before { display: none !important; }
            .piece-1 { border-radius: 20px 0 0 0; }
            .piece-2 { border-radius: 0 20px 0 0; }
            .piece-3 { border-radius: 0; }
            .piece-4 { border-radius: 0; }
            .piece-5 { border-radius: 0 0 0 20px; }
            .piece-6 { border-radius: 0 0 20px 0; }
        }

        /* 拼圖區塊共用設定 */
        .puzzle-piece {
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            color: white;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* 彈跳感動畫 */
            z-index: 1;
        }

        /* 拼圖的圖示與文字 */
        .puzzle-icon { font-size: 2rem; margin-bottom: 8px; z-index: 5; }
        .puzzle-title { font-size: 1rem; font-weight: bold; z-index: 5; letter-spacing: 1px; }

        /* 游標移上去的動畫：稍微放大、稍微旋轉、浮起來離開大長方形！ */
        .puzzle-piece:hover {
            transform: scale(1.08) rotate(-3deg);
            z-index: 10;
            border-radius: 15px; /* 分離時邊緣變圓滑 */
            box-shadow: 0 15px 25px rgba(0,0,0,0.2);
        }

        /* 🟢 設定每塊拼圖的顏色與大長方形的四個外圓角 */
        .piece-1 { background-color: #3b82f6; border-top-left-radius: 20px; z-index: 3;} /* 藍 */
        .piece-2 { background-color: #10b981; z-index: 2;} /* 綠 */
        .piece-3 { background-color: #8b5cf6; border-top-right-radius: 20px; z-index: 3;} /* 紫 */
        .piece-4 { background-color: #f59e0b; border-bottom-left-radius: 20px; z-index: 4;} /* 橘 */
        .piece-5 { background-color: #ef4444; z-index: 5;} /* 紅 */
        .piece-6 { background-color: #06b6d4; border-bottom-right-radius: 20px; z-index: 4;} /* 青 */

        /* 🟢 畫出拼圖的凸起接頭 (Knobs) */
        /* 利用偽元素 ::after 在拼圖邊緣畫出圓形，覆蓋到隔壁塊，製造出拼圖互扣的錯覺 */
        .puzzle-piece::after {
            content: '';
            position: absolute;
            background-color: inherit; /* 繼承該塊拼圖的顏色 */
            border-radius: 50%;
            z-index: -1;
        }

        /* 拼圖 1：往右凸 */
        .piece-1::after { top: 50%; right: -15px; width: 30px; height: 30px; transform: translateY(-50%); }
        /* 拼圖 2：往下凸 */
        .piece-2::after { bottom: -15px; left: 50%; width: 30px; height: 30px; transform: translateX(-50%); }
        /* 拼圖 3：往左凸 */
        .piece-3::after { top: 50%; left: -15px; width: 30px; height: 30px; transform: translateY(-50%); }
        /* 拼圖 4：往上凸、往右凸 */
        .piece-4::after { top: -15px; left: 50%; width: 30px; height: 30px; transform: translateX(-50%); box-shadow: 60px 55px 0 0 inherit; } /* 用陰影畫第二個凸起 */
        .piece-4::before { content: ''; position: absolute; top: 50%; right: -15px; width: 30px; height: 30px; background-color: inherit; border-radius: 50%; transform: translateY(-50%); z-index: -1; }
        /* 拼圖 5：往右凸 */
        .piece-5::after { top: 50%; right: -15px; width: 30px; height: 30px; transform: translateY(-50%); }
        /* 拼圖 6：往上凸 */
        .piece-6::after { top: -15px; left: 50%; width: 30px; height: 30px; transform: translateX(-50%); }

        /* 📱 手機版微調：將拼圖變成單欄堆疊，或是維持兩欄較小的網格 */
        @media (max-width: 768px) {
            .puzzle-container {
                grid-template-columns: repeat(2, 1fr);
                grid-template-rows: repeat(3, 100px);
            }
            /* 手機版排版改變，接頭方向會錯亂，所以先把拼圖接頭隱藏，保持圓角方塊即可 */
            .puzzle-piece::after, .puzzle-piece::before { display: none; }
            .piece-1 { border-radius: 20px 0 0 0; }
            .piece-2 { border-radius: 0 20px 0 0; }
            .piece-3 { border-radius: 0; }
            .piece-4 { border-radius: 0; }
            .piece-5 { border-radius: 0 0 0 20px; }
            .piece-6 { border-radius: 0 0 20px 0; }
        }

        /* ========================================== */
        /* 📱 手機版專屬微調：行事曆置中、拼圖比例控制 */
        /* ========================================== */
        @media (max-width: 768px) {
            /* 🟢 1. 減少兩側空白，讓行事曆與卡片變寬 */
            #dashboard-section { padding-left: 6px !important; padding-right: 6px !important; }
            .platform-card { padding: 15px 10px !important; }

            /* 🟢 2. 按鈕拼圖等比縮小，並將數字完美置中 */
            /* 🟢 2. 按鈕拼圖等比縮小，並將數字完美置中對齊 */
            .nav-card {
                position: relative !important;
                overflow: hidden !important;
            }
            /* 控制背後的拼圖圖案位置 */
            .nav-card::after, .nav-card::before {
                transform: scale(0.5) !important; /* 拼圖縮小比例 */
                transform-origin: top right !important;
                right: 0px !important;
                top: 0px !important;
            }
            /* 控制前方的數字位置，強制定住與拼圖重疊 */
            .nav-card .concept-number {
                position: absolute !important;
                top: 5px !important;    /* 往下微調，讓它對準拼圖中心 */
                right: 5px !important;  /* 往右微調，讓它對準拼圖中心 */
                width: 50px !important;
                height: 50px !important;
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                font-size: 1.25rem !important; 
                margin: 0 !important;
                padding: 0 !important;
            }
            
            /* 🟢 3. 行事曆字體與按鈕微調 */
            #calendar-section h2 { font-size: 19px !important; } /* 「本月排程」縮小 1px */
            .fc .fc-toolbar-title { font-size: 15px !important; margin: 0 5px !important; } /* 月份標題縮小 2px 並增加間距 */
            .fc .fc-today-button { display: none !important; } /* 隱藏手機版 today 按鈕防重疊 */
            
            .fc .fc-event-time { display: none !important; }
            .fc .fc-event-title { font-size: 10px !important; font-weight: normal !important; }
            
            /* 🟢 4. 讓行事曆有底色的按鈕 (month, week, <, >) 文字與圖示完美上下左右置中 */
            .fc .fc-button { 
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                height: 28px !important; 
                padding: 0 8px !important; 
                font-size: 0.82rem !important; 
                line-height: 1 !important; 
            }
            .fc .fc-button .fc-icon {
                display: flex !important;
                align-items: center !important;
                justify-content: center !important;
                font-size: 0.95rem !important;
                margin: 0 !important;
            }
        }
        
        /* ========================================== */
        /* 🟢 登入頁經典灰色拼圖樣式與「懸停拼合」動畫 */
        /* ========================================== */
        .puzzle-svg-container {
            width: 100%;
            height: auto;
            max-width: 320px;
            cursor: pointer;
        }

        .grey-piece {
            fill: #9ca3af; /* 乾淨標準的灰色 */
            stroke: #ffffff; /* 加上白邊讓拼圖邊界更明顯俐落 */
            stroke-width: 2px;
            /* 使用帶有一點彈性 (bouncy) 的平滑過渡效果 */
            transition: all 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); 
            transform-origin: center;
        }

        /* 初始狀態：三塊拼圖各自散開、稍微旋轉 */
        .piece-1 { transform: translate(-25px, -25px) rotate(-8deg); }
        .piece-2 { transform: translate(30px, -15px) rotate(6deg); }
        .piece-3 { transform: translate(-15px, 30px) rotate(-5deg); }

        /* 滑鼠懸停狀態：三塊拼圖瞬間完美咬合 */
        .puzzle-svg-container:hover .piece-1,
        .puzzle-svg-container:hover .piece-2,
        .puzzle-svg-container:hover .piece-3 {
            transform: translate(0, 0) rotate(0deg);
        }
    </style>
</head>
<body>
    <header id="main-nav" class="app-header d-none">
        <div class="header-left">
            <div class="header-logo-icon">
                <i class="fas fa-shapes"></i>
            </div>
            <div class="header-brand">
                <span class="header-brand-main">特教溝通平台</span>
                <span class="header-brand-sub">Communication Platform</span>
            </div>
        </div>

        <div class="header-right" style="position: relative;">
            
            <button class="header-icon-btn" id="btn-notification" title="通知中心" onclick="toggleNotificationMenu()">
                <i class="far fa-bell"></i>
            </button>

            <div id="notification-menu" class="notification-dropdown">
                <div class="notif-header">
                    <span>通知中心</span>
                    <button class="btn btn-link btn-sm text-secondary p-0 text-decoration-none" onclick="clearAllNotifications()">清除全部</button>
                </div>
                <ul id="notification-list" class="notif-list">
                    <li class="notif-empty">
                        <i class="far fa-bell-slash fa-2x mb-2" style="color:#cbd5e1;"></i>
                        <p class="mb-0 small">目前沒有新通知</p>
                    </li>
                </ul>
            </div>

            <button class="header-icon-btn" id="btn-logout" onclick="logout()" title="登出系統">
                <i class="fas fa-sign-out-alt"></i>
            </button>

            <div class="header-divider"></div>

            <div class="user-profile-group">
                <div>
                    <span id="nav-user-info" class="user-role-text">載入中哈...</span>
                </div>

                <div class="avatar-wrapper" title="個人設定">
                    <div class="header-avatar">
                        <img id="header-user-avatar" src="sticker1.png" alt="User">
                    </div>
                    <div class="status-indicator"></div>
                </div>
            </div>

        </div>
    </header>

    <div id="login-section" class="container">
       <div class="hero">
            <div class="hero-content">
                <span class="section-label">Communication Platform</span>
                
                <h1 class="display-text">
                    特教跨專團 <br>
                    <span class="circle-sketch">溝通平台</span>
                </h1>
                
                <p class="body-text highlight-border mb-5">
                    打造跨專業團隊更便利的溝通橋樑
                </p>

                <div class="card border-0 shadow-sm p-4" style="max-width: 400px; background: rgba(255,255,255,0.95);">
                  <div class="mb-3 input-group input-group-lg bg-light rounded-3 border-0" style="box-shadow: inset 0 1px 2px rgba(0,0,0,0.075);">
                    <span class="input-group-text bg-transparent border-0 ps-3 text-secondary">
                        <i class="fas fa-user"></i> </span>
                    <input type="text" id="login-username" class="form-control bg-transparent border-0 ps-2" placeholder="Username" style="font-weight: 500;">
                </div>

                <div class="mb-4 input-group input-group-lg bg-light rounded-3 border-0" style="box-shadow: inset 0 1px 2px rgba(0,0,0,0.075);">
                    <span class="input-group-text bg-transparent border-0 ps-3 text-secondary">
                        <i class="fas fa-lock"></i> </span>
                    <input type="password" id="login-password" class="form-control bg-transparent border-0 ps-2" placeholder="Password" style="font-weight: 500;">
                </div>
                    <button class="btn btn-primary w-100 btn-lg fw-bold rounded-pill" 
                            style="background-color: var(--accent-color); border: none;"
                            onclick="login()">
                        Login <i class="fas fa-arrow-right ms-2"></i>
                    </button>
                </div>
            </div>
            
            <div class="hero-image-wrapper d-none d-md-flex align-items-center justify-content-center position-relative" style="min-height: 400px;">
                
                <svg viewBox="-40 -40 300 300" xmlns="http://www.w3.org/2000/svg" class="puzzle-svg-container">
                    <defs>
                        <filter id="puzzleShadow" x="-20%" y="-20%" width="140%" height="140%">
                            <feDropShadow dx="3" dy="5" stdDeviation="4" flood-opacity="0.15" />
                        </filter>
                    </defs>

                    <path class="grey-piece piece-1" filter="url(#puzzleShadow)" d="M 10,10 L 110,10 L 110,45 C 135,45 135,75 110,75 L 110,110 L 75,110 C 75,85 45,85 45,110 L 10,110 Z" />
                    
                    <path class="grey-piece piece-2" filter="url(#puzzleShadow)" d="M 110,10 L 210,10 L 210,110 L 175,110 C 175,85 145,85 145,110 L 110,110 L 110,75 C 135,75 135,45 110,45 Z" />
                    
                    <path class="grey-piece piece-3" filter="url(#puzzleShadow)" d="M 10,110 L 45,110 C 45,85 75,85 75,110 L 110,110 L 110,145 C 135,145 135,175 110,175 L 110,210 L 10,210 Z" />
                </svg>
                
                <div class="position-absolute w-100 text-center" style="bottom: 20px;">
                    <span class="image-caption text-secondary fw-bold" style="letter-spacing: 2px;">COOPERATION & INTEGRATION</span>
                </div>
            </div>

        </div>
    </div>

    <div id="dashboard-section" class="container mt-4 mb-5 px-3">
        
        <div class="text-center mb-4">
            <h4 class="fw-bold text-primary mb-1" style="letter-spacing: 2px;">特殊教育跨專業團隊溝通平台</h4>
            <p class="text-muted small">點擊下方拼圖區塊進入功能</p>
        </div>

        <div class="puzzle-container">
            <div class="puzzle-piece piece-1" onclick="showSection('records')">
                <i class="fas fa-file-medical puzzle-icon"></i>
                <div class="puzzle-title">治療紀錄</div>
            </div>
            
            <div class="puzzle-piece piece-2" onclick="showSection('iep')">
                <i class="fas fa-folder-open puzzle-icon"></i>
                <div class="puzzle-title">IEP 資料</div>
            </div>

            <div class="puzzle-piece piece-3" onclick="showSection('messages')">
                <i class="fas fa-comments puzzle-icon"></i>
                <div class="puzzle-title">留言板</div>
            </div>

            <div class="puzzle-piece piece-4" onclick="showSection('calendar')">
                <i class="fas fa-calendar-alt puzzle-icon"></i>
                <div class="puzzle-title">行事曆</div>
            </div>

            <div class="puzzle-piece piece-5" onclick="showSection('home-log')">
                <i class="fas fa-home puzzle-icon"></i>
                <div class="puzzle-title">居家表現</div>
            </div>

            <div class="puzzle-piece piece-6" onclick="showSection('questions')">
                <i class="fas fa-question-circle puzzle-icon"></i>
                <div class="puzzle-title">提問回覆</div>
            </div>
        </div>
    </div>

    <div id="section-calendar" class="d-none">
    </div>

    <div class="modal fade" id="therapyRecordModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg modal-dialog-scrollable">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-primary text-white">
                    <h5 class="modal-title fw-bold"><i class="fas fa-clipboard-list me-2"></i>新增治療課紀錄</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4" style="background-color: #F6F8FA;">
                    <form id="therapyForm">
                        <div class="platform-card mb-3 p-3">
                            <h6 class="fw-bold text-primary mb-3">▍課程基本資訊</h6>
                            <div class="row g-3 align-items-end">
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold text-secondary">課程日期</label>
                                    <input type="date" class="form-control" id="form-date" required>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold text-secondary">形式</label>
                                    <div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="form-type" value="小組" id="type-group">
                                            <label class="form-check-label" for="type-group">小組</label>
                                        </div>
                                        <div class="form-check form-check-inline">
                                            <input class="form-check-input" type="radio" name="form-type" value="個別" id="type-indiv" checked>
                                            <label class="form-check-label" for="type-indiv">個別</label>
                                        </div>
                                    </div>
                                </div>
                                <div class="col-md-4">
                                    <label class="form-label small fw-bold text-secondary">時長</label>
                                    <div class="d-flex align-items-center">
                                        <input type="number" class="form-control text-center" id="form-duration" style="width: 80px;">
                                        <span class="ms-2 text-secondary fw-bold">分鐘</span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="platform-card mb-3 p-3">
                            <h6 class="fw-bold text-primary mb-2">▍幼兒參與狀況</h6>
                            <div class="row g-2">
                                <div class="col-6"><div class="form-check"><input class="check-part form-check-input" type="checkbox" value="積極參與" id="part-active"><label class="form-check-label" for="part-active">積極參與</label></div></div>
                                <div class="col-6"><div class="form-check"><input class="check-part form-check-input" type="checkbox" value="感興趣" id="part-interest"><label class="form-check-label" for="part-interest">感興趣</label></div></div>
                                <div class="col-6"><div class="form-check"><input class="check-part form-check-input" type="checkbox" value="易分心" id="part-distracted"><label class="form-check-label" for="part-distracted">易分心</label></div></div>
                                <div class="col-6"><div class="form-check"><input class="check-part form-check-input" type="checkbox" value="投入度低" id="part-low"><label class="form-check-label" for="part-low">投入度低</label></div></div>
                                <div class="col-12 mt-2">
                                    <div class="d-flex align-items-center">
                                        <div class="form-check mb-0 me-2">
                                            <input class="form-check-input" type="checkbox" id="check-part-other" onchange="document.getElementById('input-part-other').disabled = !this.checked">
                                            <label class="form-check-label" for="check-part-other">其他</label>
                                        </div>
                                        <input type="text" class="form-control form-control-sm" id="input-part-other" placeholder="請填寫其他狀況" disabled style="max-width: 250px;">
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="platform-card mb-3 p-3">
                            <h6 class="fw-bold text-primary mb-2">▍本堂課程學習內容及目標</h6>
                            <div class="mb-3 border-bottom pb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="check-comp" onchange="document.getElementById('area-comp').classList.toggle('d-none', !this.checked)">
                                    <label class="form-check-label fw-bold" for="check-comp">語言理解</label>
                                </div>
                                <div id="area-comp" class="d-none mt-2 ps-3 border-start border-3 border-primary bg-white p-2">
                                    <input type="text" class="form-control form-control-sm mb-2" id="input-comp-content" placeholder="請填寫學習內容">
                                    <select class="form-select form-select-sm" id="select-comp-perf">
                                        <option value="" disabled selected class="text-secondary">選擇幼兒表現</option>
                                        <option>能獨立完成</option><option>在少量提醒下完成</option><option>需較多引導</option><option>仍需練習</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3 border-bottom pb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="check-exp" onchange="document.getElementById('area-exp').classList.toggle('d-none', !this.checked)">
                                    <label class="form-check-label fw-bold" for="check-exp">語言表達</label>
                                </div>
                                <div id="area-exp" class="d-none mt-2 ps-3 border-start border-3 border-success bg-white p-2">
                                    <input type="text" class="form-control form-control-sm mb-2" id="input-exp-content" placeholder="請填寫學習內容">
                                    <select class="form-select form-select-sm" id="select-exp-perf">
                                        <option value="" disabled selected class="text-secondary">選擇幼兒表現</option>
                                        <option>能獨立完成</option><option>在少量提醒下完成</option><option>需較多引導</option><option>仍需練習</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3 border-bottom pb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="check-art" onchange="document.getElementById('area-art').classList.toggle('d-none', !this.checked)">
                                    <label class="form-check-label fw-bold" for="check-art">構音練習</label>
                                </div>
                                <div id="area-art" class="d-none mt-2 ps-3 border-start border-3 border-warning bg-white p-2">
                                    <input type="text" class="form-control form-control-sm mb-2" id="input-art-content" placeholder="請填寫學習內容">
                                    <select class="form-select form-select-sm" id="select-art-perf">
                                        <option value="" disabled selected class="text-secondary">選擇幼兒表現</option>
                                        <option>能獨立完成</option><option>在少量提醒下完成</option><option>需較多引導</option><option>仍需練習</option>
                                    </select>
                                </div>
                            </div>
                            <div class="mb-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="checkbox" id="check-comm" onchange="document.getElementById('area-comm').classList.toggle('d-none', !this.checked)">
                                    <label class="form-check-label fw-bold" for="check-comm">溝通互動</label>
                                </div>
                                <div id="area-comm" class="d-none mt-2 ps-3 border-start border-3 border-info bg-white p-2">
                                    <input type="text" class="form-control form-control-sm mb-2" id="input-comm-content" placeholder="請填寫學習內容">
                                    <select class="form-select form-select-sm" id="select-comm-perf">
                                        <option value="" disabled selected class="text-secondary">選擇幼兒表現</option>
                                        <option>能獨立完成</option><option>在少量提醒下完成</option><option>需較多引導</option><option>仍需練習</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <div class="platform-card mb-3 p-3">
                            <h6 class="fw-bold text-primary mb-2">▍班級延伸策略或建議事項</h6>
                            <textarea class="form-control" id="input-strategies" rows="3" placeholder="請填寫班級延伸策略或建議事項"></textarea>
                        </div>

                        <div class="platform-card p-3">
                            <h6 class="fw-bold text-primary mb-2">▍補充事項</h6>
                            <textarea class="form-control" id="input-remarks" rows="2" placeholder="若無可留空"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="submitTherapyRecord()">送出</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="eventModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content border-0 shadow">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title"><i class="far fa-calendar-plus me-2"></i>行事曆事件</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body p-4">
                    <form id="eventForm">
                        <input type="hidden" id="evt-id">
                        <div class="mb-3">
                            <label class="form-label small fw-bold text-secondary">標題</label>
                            <input type="text" class="form-control" id="evt-title" required placeholder="例如：期末 IEP 會議">
                        </div>
                        <div class="row g-3">
                            <div class="col-6">
                                <label class="form-label small fw-bold text-secondary">開始時間</label>
                                <input type="datetime-local" class="form-control" id="evt-start" required>
                            </div>
                            <div class="col-6">
                                <label class="form-label small fw-bold text-secondary">結束時間</label>
                                <input type="datetime-local" class="form-control" id="evt-end">
                            </div>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-danger d-none" id="btn-del-evt" onclick="deleteEvent()">刪除</button>
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-dark" onclick="saveEvent()">儲存事件</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
    <script src="client.js?v=cors_fix_final"></script>

</body>
</html>
